<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Descent Companion</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Descent Companion</h1>
        <span class="sync-pill" id="sync-pill" role="status" aria-live="polite">◌ locale</span>
      </header>
      <div class="sbx-bar" id="sbx-bar" hidden></div>
      <main id="main">
        <section class="screen active" id="scr-inv"></section>
        <section class="screen" id="scr-mkt"></section>
        <section class="screen" id="scr-own"></section>
        <section class="screen" id="scr-opt"></section>
        <section class="screen" id="scr-set"></section>
      </main>
      <nav aria-label="Sezioni">
        <button class="active" aria-current="page" data-action="goScreen" data-scr="scr-inv">
          <span class="ic" aria-hidden="true">🎒</span>Inventario
        </button>
        <button data-action="goScreen" data-scr="scr-mkt"><span class="ic" aria-hidden="true">⚖️</span>Mercato</button>
        <button data-action="goScreen" data-scr="scr-own"><span class="ic" aria-hidden="true">📜</span>Ricette</button>
        <button data-action="goScreen" data-scr="scr-opt">
          <span class="ic" aria-hidden="true">⚡</span>Ottimizza
        </button>
        <button data-action="goScreen" data-scr="scr-set"><span class="ic" aria-hidden="true">⚙️</span>Altro</button>
      </nav>
      <div id="modals"></div>
      <div class="toast" id="toast" role="status" aria-live="polite"></div>
    </div>
  </body>
</html>
