name: Deploy to GitHub Pages (tag)

# Pubblica il sito su GitHub Pages ogni volta che viene pushato
# un tag di versione tipo v0.0.1, v1.2.3, ecc.
# Richiede: Settings > Pages > Source = "GitHub Actions"
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  pages: write
  id-token: write

# Un solo deploy alla volta; non annullare quello in corso.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Prepara i file del sito
        run: |
          mkdir _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
